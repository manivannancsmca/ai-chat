<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat — Text & Voice</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-2: #242836;
            --border: #2e3345;
            --text: #e8eaed;
            --text-muted: #9aa0b0;
            --primary: #6c8cff;
            --primary-hover: #5a7af0;
            --user-bg: #2a3350;
            --ai-bg: #1e2230;
            --danger: #ff6b6b;
            --success: #51cf66;
            --radius: 14px;
            --shadow: 0 8px 32px rgba(0, 0, 0, .35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 14px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        header h1 {
            font-size: 1.15rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        /* Chat area */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .msg {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            animation: fadeIn .25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .msg.user .avatar {
            background: var(--primary);
            color: #fff;
        }

        .msg.ai .avatar {
            background: var(--surface-2);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .bubble {
            padding: 12px 16px;
            border-radius: var(--radius);
            line-height: 1.55;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-width: min(100%, 640px);
        }

        .msg.user .bubble {
            background: var(--user-bg);
            border-bottom-right-radius: 4px;
        }

        .msg.ai .bubble {
            background: var(--ai-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .msg.user .meta {
            text-align: right;
        }

        /* Typing indicator */
        .typing .bubble {
            display: flex;
            gap: 5px;
            padding: 14px 18px;
        }

        .typing span {
            width: 7px;
            height: 7px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: .4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* Input bar */
        footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 12px 16px 16px;
        }

        .input-wrap {
            max-width: 780px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            resize: none;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            padding: 12px 14px;
            font-size: 0.95rem;
            font-family: inherit;
            line-height: 1.4;
            max-height: 140px;
            outline: none;
            transition: border-color .15s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .btn {
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, transform .1s;
            flex-shrink: 0;
        }

        .btn:active {
            transform: scale(.96);
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .btn-send {
            width: 46px;
            height: 46px;
            background: var(--primary);
            color: #fff;
        }

        .btn-send:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-mic {
            width: 46px;
            height: 46px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-mic:hover:not(:disabled) {
            background: var(--border);
        }

        .btn-mic.recording {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 107, 107, .5);
            }

            50% {
                box-shadow: 0 0 0 8px rgba(255, 107, 107, 0);
            }
        }

        .toolbar {
            max-width: 780px;
            margin: 0 auto 8px;
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .toolbar label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 40px 20px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .bubble {
                max-width: 85vw;
            }

            header h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            AI Chat
        </h1>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Ready</span>
        </div>
    </header>

    <main id="chat">
        <div class="hint" id="welcome">
            Start a text conversation or hold the mic to talk.<br />
            Powered by Spring AI + Ollama (Llama 3.2)
        </div>
    </main>

    <footer>
        <div class="toolbar">
            <label>
                <input type="checkbox" id="streamToggle" checked />
                Stream response
            </label>
            <span id="convInfo"></span>
        </div>
        <div class="input-wrap">
            <button class="btn btn-mic" id="micBtn" title="Hold to record / click to toggle" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z" />
                </svg>
            </button>
            <textarea id="input" rows="1" placeholder="Type a message…" autofocus></textarea>
            <button class="btn btn-send" id="sendBtn" type="button" title="Send">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                </svg>
            </button>
        </div>
    </footer>

    <script>
        const API_BASE = ''; // same origin; change if backend is on another host
        const chatEl = document.getElementById('chat');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const streamToggle = document.getElementById('streamToggle');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const convInfo = document.getElementById('convInfo');
        const welcome = document.getElementById('welcome');

        let conversationId = null;
        let isBusy = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // Auto-resize textarea
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
        });

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendText();
            }
        });

        sendBtn.addEventListener('click', sendText);
        micBtn.addEventListener('click', toggleMic);

        function setBusy(busy, label = 'Ready') {
            isBusy = busy;
            sendBtn.disabled = busy;
            micBtn.disabled = busy && !isRecording;
            statusText.textContent = label;
            statusDot.style.background = busy ? '#fcc419' : 'var(--success)';
        }

        function clearWelcome() {
            if (welcome) welcome.remove();
        }

        function appendMessage(role, text, meta = '') {
            clearWelcome();
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            const avatar = role === 'user' ? 'You' : 'AI';
            div.innerHTML = `
      <div class="avatar">${avatar}</div>
      <div>
        <div class="bubble"></div>
        ${meta ? `<div class="meta">${meta}</div>` : ''}
      </div>`;
            div.querySelector('.bubble').textContent = text;
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
            return div.querySelector('.bubble');
        }

        function showTyping() {
            clearWelcome();
            const div = document.createElement('div');
            div.className = 'msg ai typing';
            div.id = 'typing';
            div.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble"><span></span><span></span><span></span></div>`;
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function removeTyping() {
            document.getElementById('typing')?.remove();
        }

        function updateConvInfo() {
            convInfo.textContent = conversationId
                ? `Conversation: ${conversationId.slice(0, 8)}…`
                : '';
        }

        // ---------- Text chat ----------
        async function sendText() {
            const message = inputEl.value.trim();
            if (!message || isBusy) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';
            appendMessage('user', message);
            setBusy(true, 'Thinking…');

            try {
                if (streamToggle.checked) {
                    await streamChat(message);
                } else {
                    await normalChat(message);
                }
            } catch (err) {
                removeTyping();
                appendMessage('ai', 'Error: ' + (err.message || 'Request failed'));
            } finally {
                setBusy(false);
            }
        }

        async function normalChat(message) {
            showTyping();
            const res = await fetch(`${API_BASE}/api/v1/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, conversationId })
            });
            removeTyping();
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || res.statusText);
            }
            const data = await res.json();
            conversationId = data.conversationId;
            updateConvInfo();
            appendMessage('ai', data.message, data.model || '');
        }

        async function streamChat(message) {
            showTyping();
            const res = await fetch(`${API_BASE}/api/v1/chat/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, conversationId })
            });

            if (!res.ok) {
                removeTyping();
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || res.statusText);
            }

            removeTyping();
            const bubble = appendMessage('ai', '');
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                // SSE: lines starting with "data:"
                const parts = buffer.split('\n');
                buffer = parts.pop(); // incomplete line

                for (const line of parts) {
                    if (line.startsWith('data:')) {
                        const token = line.slice(5).trimStart();
                        // Spring may send empty data lines as keep-alives
                        if (token === '[DONE]') continue;
                        bubble.textContent += token;
                        chatEl.scrollTop = chatEl.scrollHeight;
                    }
                }
            }
            // Note: conversationId is not returned by pure token stream;
            // first non-stream call or a header can set it. Keep previous id.
        }

        // ---------- Voice chat ----------
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        async function toggleMic() {
            if (!SpeechRecognition) {
                alert('Speech recognition not supported in this browser. Use Chrome/Edge.');
                return;
            }
            if (isRecording) {
                // stop handled by recognition.onend
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            isRecording = true;
            micBtn.classList.add('recording');
            setBusy(true, 'Listening…');

            recognition.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                isRecording = false;
                micBtn.classList.remove('recording');
                appendMessage('user', text, 'voice');
                inputEl.value = text;
                await sendText(); // reuses existing text/stream chat
            };

            recognition.onerror = (e) => {
                isRecording = false;
                micBtn.classList.remove('recording');
                setBusy(false);
                appendMessage('ai', 'Voice error: ' + e.error);
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.classList.remove('recording');
                if (!isBusy) setBusy(false);
            };

            recognition.start();
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                setBusy(true, 'Processing voice…');
            }
        }

        function preferredMime() {
            if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) return 'audio/webm;codecs=opus';
            if (MediaRecorder.isTypeSupported('audio/webm')) return 'audio/webm';
            if (MediaRecorder.isTypeSupported('audio/ogg')) return 'audio/ogg';
            return 'audio/wav';
        }

        async function sendVoice(blob) {
            appendMessage('user', '🎤 Voice message');
            showTyping();

            const form = new FormData();
            const ext = blob.type.includes('webm') ? 'webm' : blob.type.includes('ogg') ? 'ogg' : 'wav';
            form.append('audio', blob, `recording.${ext}`);
            if (conversationId) form.append('conversationId', conversationId);

            try {
                const res = await fetch(`${API_BASE}/api/v1/voice-chat`, {
                    method: 'POST',
                    body: form
                });
                removeTyping();

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || res.statusText);
                }

                const data = await res.json();
                conversationId = data.conversationId;
                updateConvInfo();

                // Show transcription + AI text
                if (data.transcribedText) {
                    appendMessage('user', data.transcribedText, 'transcribed');
                }
                appendMessage('ai', data.aiResponseText || '(no response)', data.model || '');

                // Play returned audio if present
                if (data.audioBase64) {
                    const mime = data.audioContentType || 'audio/wav';
                    const audio = new Audio(`data:${mime};base64,${data.audioBase64}`);
                    audio.play().catch(() => { });
                }
            } catch (err) {
                removeTyping();
                appendMessage('ai', 'Voice error: ' + (err.message || 'failed'));
            } finally {
                setBusy(false);
            }
        }
    </script>
</body>

</html>
